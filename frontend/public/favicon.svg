<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="YojnaVia">
  <!-- Ashoka Navy fill -->
  <rect width="48" height="48" rx="10" fill="#0B132B"/>
  <!-- Left arm of Y -->
  <path d="M10 10 L24 26" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right arm of Y -->
  <path d="M38 10 L24 26" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Stem of Y -->
  <path d="M24 26 L24 40" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Saffron chakra dot -->
  <circle cx="24" cy="26" r="4.5" fill="#D97706"/>
  <circle cx="24" cy="26" r="2.2" fill="#FBFBFA"/>
  <circle cx="24" cy="26" r="0.9" fill="#D97706"/>
  <!-- Saffron base accent -->
  <rect x="20" y="38.5" width="8" height="2" rx="1" fill="#D97706"/>
</svg>
