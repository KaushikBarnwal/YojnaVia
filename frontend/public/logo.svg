<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="YojnaVia logo">
  <!-- Background square — Ashoka Navy -->
  <rect width="48" height="48" rx="10" fill="#0B132B"/>

  <!-- Saffron offset shadow block (bottom-right) -->
  <rect x="3" y="3" width="45" height="45" rx="10" fill="#D97706" opacity="0.18"/>

  <!-- ── Main letterform: stylised "Y" with crossbar ── -->
  <!-- Left arm of Y -->
  <path d="M10 10 L24 26" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right arm of Y -->
  <path d="M38 10 L24 26" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Stem of Y -->
  <path d="M24 26 L24 40" stroke="#FBFBFA" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Saffron chakra dot at the fork — the decisive junction of paths -->
  <circle cx="24" cy="26" r="4.5" fill="#D97706"/>
  <!-- Inner white ring (Ashoka wheel echo) -->
  <circle cx="24" cy="26" r="2.2" fill="#FBFBFA"/>
  <!-- Gold centre pip -->
  <circle cx="24" cy="26" r="0.9" fill="#D97706"/>

  <!-- Thin saffron underline accent on the stem bottom -->
  <rect x="20" y="38.5" width="8" height="2" rx="1" fill="#D97706"/>
</svg>
